  # Keep only the patched transitive versions that parent ranges still allow.
  "proxy-addr@>=2 <2.0.8": "2.0.8"
  "fast-uri@>=3 <3.1.9": "3.1.9"
  "devalue@>=5 <5.9.3": ">=5.9.3 <6"
  "postcss@>=8 <8.5.23": ">=8.5.23 <9"
