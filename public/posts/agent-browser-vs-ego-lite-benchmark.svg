  <rect x="794.667" y="228" width="357.333" height="100" rx="16" fill="#161619" stroke="#39393f" stroke-width="1.5"/>
  <text x="814.667" y="256" fill="#c6b5ff" font-size="12" font-weight="700" letter-spacing="1.6" font-family="ui-monospace,SFMono-Regular,monospace">BYTES</text>
