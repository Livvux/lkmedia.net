  <text x="68" y="292" fill="#f7f7f8" font-size="26" font-weight="650">3,7× schneller</text>
  <text x="68" y="316" fill="#8f8f98" font-size="14">1,22 s gegen 4,46 s</text>
  <rect x="421.333" y="228" width="357.333" height="100" rx="16" fill="#161619" stroke="#39393f" stroke-width="1.5"/>
  <text x="441.333" y="256" fill="#c6b5ff" font-size="12" font-weight="700" letter-spacing="1.6" font-family="ui-monospace,SFMono-Regular,monospace">ERGEBNIS</text>
