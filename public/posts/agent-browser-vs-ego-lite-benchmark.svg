<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">agent-browser vs. ego-lite: Benchmark mit 120 Läufen</title>
<desc id="desc">Balkendiagramm: agent-browser ist je Aufgabe 4,3- bis 11,8-mal schneller als ego-lite. Summe der Medianzeiten 1,22 s gegen 4,46 s, 0 Fehler in 120 Läufen.</desc>
<rect width="1200" height="675" fill="#09090b"/>
<rect x="24" y="24" width="1152" height="627" rx="22" fill="#101012" stroke="#34343b" stroke-width="2"/>
<rect x="49" y="50" width="9" height="9" rx="2" fill="#c6b5ff"/>
<text x="72" y="59" fill="#b7b7be" font-size="15" font-weight="650" letter-spacing="2.5" font-family="system-ui,-apple-system,Segoe UI,sans-serif">LKMEDIA / PRAXISWISSEN</text>
<text x="1149" y="59" fill="#96969f" font-size="13" font-family="ui-monospace,SFMono-Regular,monospace" text-anchor="end">BENCHMARK · 20.10.2026</text>
