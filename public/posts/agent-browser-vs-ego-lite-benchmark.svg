<text x="48" y="148" fill="#fafafa" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="38" font-weight="650" letter-spacing="-.9">agent-browser vs. ego-lite</text>
<text x="48" y="192" fill="#b4b4bc" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="22">120 Browserläufe, 10 Aufgaben, 0 Fehler – und ein klares Ergebnis.</text>
